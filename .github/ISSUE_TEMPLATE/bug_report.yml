name: Bug report
description: Report a reproducible problem with the StormSignal app
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        **Important:** Never include private coordinates, contact details, API tokens, or personal emergency information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open StormSignal...
        2. Select or search for...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed behavior
      description: What happened instead? Include any visible error message.
    validations:
      required: true
  - type: dropdown
    id: app-mode
    attributes:
      label: App mode
      description: Which mode was active when the issue occurred?
      options:
        - Full workspace
        - Data saver
        - Offline only
        - Other / Not applicable
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment & Context
      description: Provide browser, device, operating system, and viewport size.
      value: |
        - StormSignal version or commit (if known):
        - Browser and version:
        - Device / operating system:
        - Viewport size (if relevant):
        - Approximate date and time (with timezone):
        - City or region (optional; no private coordinates):
    validations:
      required: false
  - type: textarea
    id: data-source
    attributes:
      label: Data-source details (if relevant)
      description: Provider involved, source status shown by the app, live or fixture.
      placeholder: e.g. Open-Meteo forecast, NASA VIIRS satellite, NWS alert, NDMA SACHET...
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach screenshots or logs (ensure all personal coordinates and tokens are removed).
    validations:
      required: false
  - type: textarea
    id: troubleshooting
    attributes:
      label: Troubleshooting already tried
      description: List any refresh, reconnect, or cache clearance steps attempted.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification checklist
      options:
        - label: I have confirmed that no secrets, private coordinates, or sensitive personal information are included in this report.
          required: true
        - label: I have checked existing issues to see if this problem has already been reported.
          required: false
