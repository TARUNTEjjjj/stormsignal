<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · StormSignal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#060a14" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 12vh 8vw;
        background:
          radial-gradient(900px 520px at 88% -140px, rgba(139, 124, 255, 0.18), transparent 70%),
          radial-gradient(760px 440px at -6% -80px, rgba(62, 230, 193, 0.1), transparent 70%),
          #060a14;
        color: #eef3ff;
        font:
          1rem/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 40rem;
        margin: auto;
      }
      /* The wordmark the app and the kit use. */
      .brand {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .brand span {
        background: linear-gradient(120deg, #3ee6c1 0%, #8b7cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-weight: 450;
      }
      main > p:not(.brand) {
        color: #9aa7bf;
      }
      ul {
        display: grid;
        gap: 0.5rem;
        margin: 1.5rem 0 0;
        padding: 0;
        list-style: none;
      }
      h1 {
        font-size: clamp(2.25rem, 6vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        margin: 0.4em 0 0.3em;
      }
      a {
        color: #8ff3dc;
        text-underline-offset: 4px;
      }
      a:focus-visible {
        outline: 3px solid #c3bbff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">storm<span>signal</span></p>
      <h1>Page not found.</h1>
      <p>
        This address does not have a page. The workspace, the offline emergency kit and the
        preparedness guide are where they were.
      </p>
      <ul>
        <li><a href="/">Return to the weather workspace</a></li>
        <li><a href="/offline.html">Open the emergency kit</a></li>
        <li><a href="/preparedness.html">Read the preparedness guide</a></li>
      </ul>
    </main>
    <script>
      // An app update never reloads this page, so it answers the new version's safety check at
      // once instead of holding the update back while it is open.
      try {
        navigator.serviceWorker.addEventListener('message', (event) => {
          const data = event.data;
          if (
            data?.type === 'APP_UPDATE_CAN_ACTIVATE' &&
            /^[a-f0-9]{32}$/.test(data.nonce) &&
            event.ports?.[0]
          )
            event.ports[0].postMessage({
              type: 'APP_UPDATE_SAFETY',
              nonce: data.nonce,
              safe: true,
            });
        });
      } catch {}
    </script>
  </body>
</html>
